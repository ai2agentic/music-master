<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Music</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login" class="card login-card" hidden>
        <p class="eyebrow">AURORA MUSIC</p>
        <h1>Deine Musik. Dein Raum.</h1>
        <p class="muted">Melde dich an, um deine private MP3-Bibliothek zu öffnen.</p>
        <form id="login-form"><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required /><button>Öffnen</button><p id="login-error" class="error" aria-live="polite"></p></form>
      </section>
      <section id="app">
        <header class="topbar"><div><p class="eyebrow">AURORA MUSIC</p><h1>Meine Bibliothek</h1></div><div class="top-actions"><span id="count" class="pill"></span><button id="logout" class="secondary" type="button">Abmelden</button></div></header>
        <section class="card library"><input id="search" class="search" placeholder="Titel suchen …" aria-label="Titel suchen" /><ul id="tracks" class="tracks"></ul><p id="empty" class="muted" hidden>Lege MP3-Dateien in den Ordner <code>mp3/</code>.</p></section>
        <section class="card playlist"><div class="section-head"><div><p class="eyebrow">DEINE PLAYLIST</p><h2>Lieblingsmusik</h2></div><button id="clear-playlist" class="secondary" type="button">Leeren</button></div><ul id="playlist-tracks" class="tracks"></ul><p id="playlist-empty" class="muted">Füge Titel über «+» hinzu.</p></section>
        <section class="card player"><div><p class="eyebrow">JETZT LÄUFT</p><h2 id="now-playing">Noch kein Titel</h2></div><audio id="audio" controls preload="metadata"></audio></section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
